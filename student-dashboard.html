<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EarlyWatch - My Academic Status</title>
  <link rel="stylesheet" href="assets/student.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Student</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="student-dashboard.html" class="nav-item active">
        <i data-lucide="bar-chart-3"></i><span>My Performance</span>
      </a>
    </nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>AR</div>
      <div class="user-info">
        <div class="user-name" data-user-name>Alex Reyes</div>
        <div class="user-role" data-user-role>Student</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content" id="studentRoot">
    <header class="header">
      <h1>My Academic Status</h1>
      <p class="subtitle" data-user-meta>Loading…</p>
    </header>

    <div class="risk-banner" id="riskBanner">
      <i data-lucide="triangle-alert" class="risk-icon"></i>
      <div class="risk-content">
        <div class="risk-title">Loading risk status…</div>
        <div class="risk-sub"></div>
      </div>
    </div>

    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-value" data-stu="gpa">—</div>
        <div class="metric-label">GPA</div>
        <div class="metric-sub">Current term</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" data-stu="attendance">—</div>
        <div class="metric-label">Attendance</div>
        <div class="metric-sub">Across all subjects</div>
      </div>
      <div class="metric-card">
        <div class="metric-value text-success" data-stu="passing">—</div>
        <div class="metric-label">Subjects Passing</div>
        <div class="metric-sub" data-stu="passing-sub">—</div>
      </div>
    </section>

    <div class="section-title">Subject Breakdown</div>
    <div class="subjects-list" id="studentSubjects"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ewGuard("student");
    ewInitStudentDashboard();
    (function () {
      const u = ewCurrentUser();
      const s = u && u.studentId ? EW_DB.students.get(u.studentId) : null;
      const meta = document.querySelector("[data-user-meta]");
      if (meta && s) {
        meta.textContent = `${s.course} · ${s.section} · Academic Year 2026–2027, 1st Semester`;
      }
    })();
  </script>
</body>
</html>
