<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EarlyWatch - Admin · Alerts</title>
  <link rel="stylesheet" href="assets/admin.css">
  <link rel="stylesheet" href="assets/modal.css">
  <link rel="stylesheet" href="assets/skeleton.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Admin</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="adminNav"></nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>SA</div>
      <div class="user-info">
        <div class="user-name" data-user-name>System Administrator</div>
        <div class="user-role" data-user-role>Administrator</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
      <div>
        <h1>Alerts</h1>
        <p class="subtitle">Every risk alert generated across the institution.</p>
      </div>
      <button type="button" class="filter-btn btn-acknowledge-all"
              style="background:#1a202c;border:1px solid #2d3748;color:#d0d7de;">
        Acknowledge all (0)
      </button>
    </header>

    <section class="metrics-grid">
      <div class="metric-card critical">
        <div class="metric-value" data-alert-count="critical">0</div>
        <div class="metric-label">Critical</div>
        <div class="metric-sub">Immediate action</div>
      </div>
      <div class="metric-card high">
        <div class="metric-value" data-alert-count="high">0</div>
        <div class="metric-label">High</div>
        <div class="metric-sub">Intervention underway</div>
      </div>
      <div class="metric-card medium">
        <div class="metric-value" data-alert-count="medium">0</div>
        <div class="metric-label">Medium</div>
        <div class="metric-sub">Monitoring</div>
      </div>
      <div class="metric-card low">
        <div class="metric-value" data-alert-count="low">0</div>
        <div class="metric-label">Low</div>
        <div class="metric-sub">Informational</div>
      </div>
    </section>

    <div class="filter-group" style="margin-bottom:1rem;width:fit-content;">
      <button class="filter-btn tab active" data-tab="unread">Unread (0)</button>
      <button class="filter-btn tab" data-tab="all">All</button>
      <button class="filter-btn tab" data-tab="read">Read</button>
    </div>

    <div class="mini-list" id="adminAlertsList" style="gap:.85rem;"></div>
  </main>

   <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    ewGuard("admin");
    ewAdminPaintChrome("alerts");
    ewInitAdminAlerts();
  </script>
      <script>
      /* Skeleton phase for the admin alerts page */
      (function () {
        const list = document.getElementById("adminAlertsList");
        if (!list) return;
        list.innerHTML = Array.from({ length: 5 }).map(() => `
          <div class="sk-list-card">
            <div class="skeleton icon"></div>
            <div class="content">
              <div class="skeleton l1"></div>
              <div class="skeleton l2"></div>
            </div>
            <div class="skeleton btn"></div>
          </div>`).join("");
      })();
    </script>
</body>
</html>
