<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <title>EarlyWatch - Admin · Student Records</title>
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="stylesheet" href="assets/modal.css" />
    <link rel="stylesheet" href="assets/skeleton.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i data-lucide="layers"></i></div>
        <div>
          <div class="brand-name">EarlyWatch</div>
          <div class="brand-sub">Admin</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="adminNav"></nav>

      <div class="user-profile">
        <div class="avatar" data-user-initials>SA</div>
        <div class="user-info">
          <div class="user-name" data-user-name>System Administrator</div>
          <div class="user-role" data-user-role>Administrator</div>
        </div>
        <button
          type="button"
          class="logout-btn"
          onclick="ewLogout()"
          title="Logout"
        >
          <i data-lucide="log-out"></i>
        </button>
      </div>
    </aside>

      <main class="main-content">
    <header class="header">
      <h1>Student Records</h1>
      <p class="subtitle">All registered students — click a row to view the full profile.</p>
    </header>

    <section class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>School ID</th>
              <th>Course · Section</th>
              <th>Email</th>
              <th>Password</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="adminRecordsBody"></tbody>
        </table>
      </div>
    </section>

    <div class="table-footer" style="margin-top:1rem;padding:0 .25rem;
         display:flex;justify-content:space-between;align-items:center;
         font-size:.78rem;color:var(--text-muted);">
      <span class="table-footer-count">—</span>
      <span>Click a row to open the full profile · Click ✏️ to edit · Click 🗑️ to delete</span>
    </div>
  </main>

     <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    ewGuard("admin");
    ewAdminPaintChrome("records");
    ewInitAdminRecords();
    </script>
  </body>
</html>
