<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EarlyWatch - Interventions</title>
  <link rel="stylesheet" href="assets/instructor-interventions.css">
  <link rel="stylesheet" href="assets/modal.css">
    <link rel="stylesheet" href="assets/skeleton.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Instructor</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="instructor-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
      <a href="instructor-student-records.html" class="nav-item"><i data-lucide="users"></i><span>Student Records</span></a>
      <a href="instructor-interventions.html" class="nav-item active"><i data-lucide="clipboard-list"></i><span>Interventions</span></a>
      <a href="instructor-alerts.html" class="nav-item"><i data-lucide="bell"></i><span>Alerts</span><span class="badge red" id="navAlertCount">7</span></a>
    </nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>PJ</div>
      <div class="user-info">
        <div class="user-name" data-user-name>Prof. James Cruz</div>
        <div class="user-role" data-user-role>Instructor</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1>Interventions</h1>
      <p class="subtitle">Track all academic support activities and their outcomes.</p>
    </header>

    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-value text-warning" data-iv-metric="pending">0</div>
        <div class="metric-label">Pending Outcome</div>
      </div>
      <div class="metric-card">
        <div class="metric-value text-success" data-iv-metric="effective">0</div>
        <div class="metric-label">Effective</div>
      </div>
      <div class="metric-card">
        <div class="metric-value text-muted" data-iv-metric="total">0</div>
        <div class="metric-label">Total</div>
      </div>
    </section>

    <div class="section-title" data-iv-title>All Interventions (0)</div>
    <div class="interventions-list" id="interventionsList"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
    <script src="js/skeleton.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ewGuard("instructor");
    ewInitInterventionsPage();
  </script>
</body>
</html>
